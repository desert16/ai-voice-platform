# VoiceCore AI — Lokal Ağ Kurulum Kılavuzu
# =====================================================
# Sunucu 1 (PBX/Santral): 192.168.1.10   ← Asterisk + Bridge + AsteriskMgr
# Sunucu 2 (API/Panel):   192.168.1.20   ← PostgreSQL + Redis + API + Web Panel
# =====================================================
#
# Bu dosyayı kurulum sırasında yanınızda açık tutun.
# Kendi IP adreslerinize göre düzenleyin.

PBX_IP=192.168.1.10
API_IP=192.168.1.20

# ─── SUNUCU 1 ─── #

# Bridge .env
BRIDGE_PORT=9092
REDIS_URL=redis://:voicecore_redis_2024@192.168.1.20:6379
API_SERVER_URL=http://192.168.1.20:3000
GEMINI_API_KEY=AIza_BURAYA_GEMINI_KEY

# Asterisk Manager .env
AMI_HOST=127.0.0.1
AMI_PORT=5038
AMI_USER=voicecore_ami
AMI_PASSWORD=ami_secret_2024
SERVICE_TOKEN=voicecore_internal_service_token_2024
ASTERISK_CONF_DIR=/etc/asterisk
PORT=4001

# ─── SUNUCU 2 ─── #

# API .env
NODE_ENV=production
PORT=3000
DATABASE_URL=postgresql://voicecore:voicecore_secret_2024@127.0.0.1:5432/voicecore
REDIS_URL=redis://:voicecore_redis_2024@127.0.0.1:6379
JWT_SECRET=voicecore_jwt_super_secret_2024_degistirin
ASTERISK_MANAGER_URL=http://192.168.1.10:4001
SERVICE_TOKEN=voicecore_internal_service_token_2024
GEMINI_API_KEY=AIza_BURAYA_GEMINI_KEY

# Web Panel .env
VITE_API_BASE_URL=http://192.168.1.20:3000/api
