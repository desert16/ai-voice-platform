; ============================================================
; Asterisk 22 — extensions.conf (Dialplan)
; VoiceCore Multi-Tenant Platform
; ============================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; VoiceCore AudioSocket bridge adresi
VOICECORE_BRIDGE_HOST=127.0.0.1
VOICECORE_BRIDGE_PORT=9092

; ── INCLUDE — Tenant başına dialplan dosyaları ───────────────
#include extensions.d/*.conf

; ── DEFAULT CONTEXT — Tanımsız çağrılar ─────────────────────
[default]
exten => _X.,1,NoOp(Tanımsız context, çağrı reddedildi)
 same => n,Hangup(21)

; ── VOICECORE-INTERNAL — Sistem testleri ─────────────────────
[voicecore-internal]
; Echo testi
exten => 9999,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Bridge bağlantı testi
exten => 9998,1,Answer()
 same => n,AudioSocket(${VOICECORE_BRIDGE_HOST}:${VOICECORE_BRIDGE_PORT},test-uuid)
 same => n,Hangup()
