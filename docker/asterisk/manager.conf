; ============================================================
; Asterisk 22 — manager.conf (AMI - Asterisk Manager Interface)
; VoiceCore asterisk-manager servisi bu bağlantıyı kullanır
; ============================================================

[general]
enabled=yes
port=5038
bindaddr=127.0.0.1     ; Sadece localhost — güvenlik
displayconnects=yes
timestampevents=yes
; Bağlantı timeout
authtimeout=30
authlimit=5

; ── VoiceCore Servisi Kullanıcısı ────────────────────────────
[voicecore]
secret=voicecore_ami_secret
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.0
read=all
write=all
writetimeout=5
; Gerekli event kategorileri
eventfilter=Event: UserEvent
eventfilter=Event: Hangup
eventfilter=Event: Newchannel
eventfilter=Event: RegistrationComplete
eventfilter=Event: RegistrationFailed
