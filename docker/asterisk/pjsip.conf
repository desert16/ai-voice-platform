; ============================================================
; Asterisk 22 — Ana pjsip.conf
; VoiceCore Multi-Tenant Platform
; ============================================================
; Bu dosya sadece global transport tanımlarını içerir.
; Her tenant için ayrı config: /etc/asterisk/pjsip.d/tenant_*.conf
; ============================================================

; ── GLOBAL TRANSPORT ─────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ── INCLUDE — Tenant başına config dosyaları ─────────────────
; Her müşteri aktifleştirildiğinde bu klasöre dosya eklenir.
; Asterisk bu pattern'e uyan tüm dosyaları otomatik yükler.
#include pjsip.d/*.conf
