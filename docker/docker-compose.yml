version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voicecore_postgres
    environment:
      POSTGRES_DB: voicecore
      POSTGRES_USER: voicecore
      POSTGRES_PASSWORD: voicecore_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicecore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: voicecore_redis
    # bind 0.0.0.0 — Sunucu 1 (PBX/Bridge) lokal ağdan bağlanabilir
    command: >
      redis-server
      --requirepass voicecore_redis_2024
      --bind 0.0.0.0
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "6379:6379"   # Sunucu 1'den erişim için açık
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "voicecore_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: voicecore_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@voicecore.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
